# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Prolance Frontend deployment
# Used by the CD pipeline on the deployment server
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:
  prolance-frontend:
    image: farrahamami/prolance-frontend:${DOCKER_TAG:-latest}
    container_name: prolance-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
